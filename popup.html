<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Energy Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #629460 0%, #243119 100%);
      color: white;
    }
    
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .session-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    
    button:active {
      transform: translateY(0);
    }
    
    #startBtn {
      background: #67be52;
      color: #ffffff;
      font-weight: 700;
    }
    
    #endBtn {
      background: #eb4747;
      color: white;
    }
    
    #startBtn:disabled, #endBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .status-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .status-container.active {
      background: rgba(172, 236, 161, 0.3);
      border: 2px solid #ACECA1;
    }
    
    .status {
      font-weight: 600;
      flex-grow: 1;
    }
    
    .arduino-toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .arduino-label {
      font-size: 12px;
      opacity: 0.9;
      white-space: nowrap;
    }
    
    /* Toggle Switch Styles */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
      border-radius: 24px;
    }
    
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .toggle-slider {
      background-color: #67be52;
    }
    
    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }
    
    .toggle-slider:hover {
      opacity: 0.9;
    }
    
    .metrics {
      background: rgba(36, 49, 25, 0.4);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid rgba(172, 236, 161, 0.2);
    }
    
    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .metric-row:last-child {
      border-bottom: none;
    }
    
    .metric-label {
      opacity: 0.8;
      font-size: 13px;
    }
    
    .metric-value {
      font-weight: 700;
      font-size: 14px;
    }
    
    #exportData {
      width: 100%;
      background: #96BE8C;
      color: #243119;
      font-weight: 700;
      margin-top: 10px;
    }
    
    .info-text {
      font-size: 11px;
      opacity: 0.7;
      text-align: center;
      margin-top: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>🌱 ChatGPT Energy Tracker</h1>
  
  <div class="session-controls">
    <button id="startBtn">▶ Start Session</button>
    <button id="endBtn" disabled>⏹ End Session</button>
  </div>
  
  <div class="status-container" id="statusContainer">
    <div class="status" id="status">
      Session inactive
    </div>
    <div class="arduino-toggle-container">
      <span class="arduino-label">Arduino</span>
      <label class="toggle-switch">
        <input type="checkbox" id="arduinoToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
  
  <div class="metrics">
    <div class="metric-row">
      <span class="metric-label">Total Queries</span>
      <span class="metric-value" id="totalQueries">0</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Total Tokens</span>
      <span class="metric-value" id="totalTokens">0</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Time to First Query</span>
      <span class="metric-value" id="timeToFirst">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Session Duration</span>
      <span class="metric-value" id="duration">--</span>
    </div>
  </div>
  
  <button id="exportData">📊 Export Session Data (CSV)</button>
  
  <div class="info-text">
    Navigate to chatgpt.com and start a session to begin tracking
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
